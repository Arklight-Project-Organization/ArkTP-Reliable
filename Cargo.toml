[package]
name = "arktp-reliable"
version = "0.2.2"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
dashmap = "6.2.1"
env_logger = "0.11.11"
futures = "0.3"
flume = "0.12.0"
hkdf = "0.13.0"
hmac = "0.13.0"
log = "0.4.33"
lru = "0.11"
libc = "0.2"
moka = { version = "0.12.16", features = ["sync"] }
parking_lot = "0.12.5"
pqc_dilithium = "0.1"
pqc_kyber = "0.6"
rand = "0.8"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6"
sha2 = "0.11.0"
thiserror = "2.0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1.53.1", features = ["full"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[features]
default = ["reliable"]
reliable = []
# Enables extra runtime diagnostics without changing the wire protocol.
diagnostics = []

[lib]
name = "arktp_reliable"
path = "src/lib.rs"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[[bench]]
name = "high_bdp"
harness = false
